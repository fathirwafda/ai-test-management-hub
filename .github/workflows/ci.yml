name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: mock

jobs:
  quality:
    name: Lint, typecheck, unit and API tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (importers, mapping, stats, AI validation, mock provider, reports)
        run: npm run test:unit
      - name: API tests (CRUD, run lifecycle, uploads, import, AI endpoints)
        run: npm run test:api
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            packages/shared/dist
            apps/api/dist
            apps/web/dist
          retention-days: 3

  e2e:
    name: Playwright E2E (built app, mock AI provider)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
